name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m py_compile evaluator.py
      - run: python3 evaluator.py
      - run: python3 -m unittest tests/test_wasm3_boundary.py -v
      - run: bash verify.sh
